name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to the gh-pages branch.
permissions:
  contents: write

# Only one deployment at a time; cancel any in-progress run for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Front-end assets (Tailwind CSS) --------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      # ---- Static site (Pelican) ------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compute production SITEURL
        run: echo "SITEURL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: Build site with Pelican
        run: pelican content -s publishconf.py -o output

      # ---- Public landing page -------------------------------------------
      # Keep the published site focused on the requested simulator page and hide
      # the rest of the editorial blog from the live deployment.
      - name: Copy the public simulator into the published site
        run: |
          if [ -d "ticket-sales-simulator" ]; then
            mkdir -p "output/ticket-sales-simulator"
            cp -R "ticket-sales-simulator/." "output/ticket-sales-simulator/"
          fi

          cat > output/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./ticket-sales-simulator/">
              <title>Redirecting…</title>
            </head>
            <body>
              <p>Redirecting to <a href="./ticket-sales-simulator/">ticket-sales-simulator</a>…</p>
            </body>
          </html>
          EOF

      # ---- Publish --------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

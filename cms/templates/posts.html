{% extends "base.html" %}
{% block title %}{{ t('posts.title') }} · {{ app_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl space-y-6" x-data="postList()">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-[28px] leading-tight">{{ t('posts.title') }}</h1>
      <p class="text-sm text-sembcorp-gray">{{ published_count }} {{ t('status.published') }} · {{ draft_count }} {{ t('status.draft') }}</p>
    </div>
    <a href="/posts/new" class="cms-btn-primary"><i class="fa fa-plus"></i>{{ t('action.new_post') }}</a>
  </header>

  <!-- Filters -->
  <div class="cms-card flex flex-wrap items-center gap-3 p-4">
    <div class="inline-flex rounded-md border border-sembcorp-line p-0.5">
      <template x-for="tab in tabs" :key="tab.value">
        <button class="cms-btn cms-btn-sm" :class="status === tab.value ? 'bg-sembcorp-green text-white' : 'text-sembcorp-gray hover:bg-sembcorp-green-wash'"
                @click="status = tab.value" x-text="tab.label"></button>
      </template>
    </div>
    <div class="relative min-w-[200px] flex-1">
      <i class="fa fa-search pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input class="cms-input pl-9" type="search" :placeholder="'{{ t('label.search') }}'" x-model="q">
    </div>
    <select class="cms-select w-auto" x-model="category">
      <option value="">{{ t('label.category') }} — {{ t('status.all') }}</option>
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
    <select class="cms-select w-auto" x-model="sort">
      <option value="newest">{{ t('label.sort_newest') }}</option>
      <option value="oldest">{{ t('label.sort_oldest') }}</option>
      <option value="title">{{ t('label.sort_title') }}</option>
    </select>
  </div>

  <!-- List -->
  <div class="cms-card overflow-hidden">
    <template x-if="filtered.length === 0">
      <div class="px-5 py-16 text-center text-sm text-gray-500">
        <i class="fa fa-file-text-o text-3xl text-gray-300"></i>
        <p class="mt-3" x-text="'{{ t('posts.empty') }}'"></p>
      </div>
    </template>

    <ul class="divide-y divide-sembcorp-line">
      <template x-for="post in filtered" :key="post.slug">
        <li class="flex flex-wrap items-center justify-between gap-4 px-5 py-4 hover:bg-sembcorp-mist/60">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span :class="post.status === 'published' ? 'cms-badge-published' : 'cms-badge-draft'"
                    x-text="post.status === 'published' ? '{{ t('status.published') }}' : '{{ t('status.draft') }}'"></span>
              <a :href="'/posts/' + post.slug + '/edit'" class="truncate text-sm font-semibold text-sembcorp-ink hover:text-sembcorp-green" x-text="post.title"></a>
            </div>
            <p class="mt-1 truncate text-xs text-gray-500">
              <i class="fa fa-calendar-o"></i> <span x-text="post.date"></span>
              <template x-if="post.category"><span class="mx-1.5">·</span></template>
              <template x-if="post.category"><span><i class="fa fa-folder-o"></i> <span x-text="post.category"></span></span></template>
              <template x-for="tag in post.tags" :key="tag"><span class="ml-2 rounded bg-sembcorp-green-wash px-1.5 py-0.5 text-[11px] text-sembcorp-green-dark" x-text="tag"></span></template>
            </p>
          </div>
          <div class="flex shrink-0 items-center gap-1">
            <span class="hidden text-xs text-gray-400 sm:inline" x-text="post.words + ' {{ t('label.word_count') }} · ' + post.reading_time + ' {{ t('label.reading_time') }}'"></span>
            <a :href="'/posts/' + post.slug + '/edit'" class="cms-btn-ghost cms-btn-sm" title="{{ t('action.edit') }}"><i class="fa fa-pencil"></i></a>
            <button class="cms-btn-ghost cms-btn-sm" title="{{ t('action.duplicate') }}" @click="duplicate(post)"><i class="fa fa-copy"></i></button>
            <button class="cms-btn-ghost cms-btn-sm text-red-600 hover:bg-red-50" title="{{ t('action.delete') }}" @click="remove(post)"><i class="fa fa-trash-o"></i></button>
          </div>
        </li>
      </template>
    </ul>
  </div>
</div>

<script>window.__POSTS__ = {{ posts_json|tojson }};</script>
{% endblock %}

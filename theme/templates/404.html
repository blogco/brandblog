{% extends "base.html" %}

{% block title %}Page not found{% endblock %}
{% block content %}
<section class="container flex min-h-[50vh] flex-col items-center justify-center py-24 text-center">
  <p class="text-6xl font-bold text-ericsson-blue">404</p>
  <h1 class="mt-4 text-3xl font-bold text-ericsson-black">We couldn't find that page</h1>
  <p class="mt-3 max-w-md text-ericsson-gray">The page you're looking for may have moved or no longer exists.</p>
  <div class="mt-8 flex gap-3">
    <a href="{{ SITEURL }}/" class="btn-primary">Back to home</a>
    <a href="{{ SITEURL }}/news/" class="btn-outline">Browse news</a>
  </div>
</section>
{% endblock %}
